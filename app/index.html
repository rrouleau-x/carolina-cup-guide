<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0055A4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<title>Carolina Cup Guide</title><style>
  :root{
    --su:#0055A4; --su-dark:#003f7a; --su-soft:#e8f0fb;
    --link:#0a66c2; --bg:#eef1f6; --card:#ffffff;
    --ink:#1d1d1f; --muted:#6e6e73; --line:#e3e6ec;
    --green:#1a9e4a; --green-bg:#e8f6ee;
    --amber:#b76e00; --amber-bg:#fff3d6;
    --red:#d72d2d; --red-bg:#fdecec;
    --shadow:0 1px 3px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.05);
    --radius:16px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--bg)}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",Arial,sans-serif;color:var(--ink);line-height:1.45}
  .app{max-width:520px;margin:0 auto;background:var(--bg);min-height:100vh;padding-bottom:76px;position:relative}
  .num{font-family:"SF Pro Display","Segoe UI",system-ui,sans-serif;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}

  .hero{background:linear-gradient(160deg,var(--su) 0%,var(--su-dark) 100%);color:#fff;padding:22px 18px 18px;position:relative;overflow:hidden}
  .hero .kick{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:#cfe0f5;margin:0 0 3px;font-weight:600}
  .hero h1{font-size:23px;margin:0;font-weight:800;letter-spacing:-.4px}
  .hero .team{font-size:13.5px;color:#fff;opacity:.92;margin:3px 0 0;font-weight:600}
  .hero .meta{font-size:12.5px;color:#cfe0f5;margin:7px 0 0;letter-spacing:.3px}
  .hero .crest{position:absolute;right:-18px;top:-18px;width:120px;height:120px;opacity:.10;pointer-events:none}
  .hero .crest svg{width:100%;height:100%}

  /* CONTEXT STRIP + COUNTDOWN */
  .context{background:var(--su);color:#fff;padding:10px 18px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .context .chip{background:rgba(255,255,255,.16);padding:2px 9px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:.3px;white-space:nowrap}
  .countdown{background:var(--su-dark);color:#fff;padding:12px 18px;display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}
  .countdown .cd-label{font-size:11px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:#cfe0f5;width:100%;text-align:center}
  .countdown .cd-num{font-size:24px;font-weight:800;letter-spacing:-1px}
  .countdown .cd-unit{font-size:10px;font-weight:700;color:#cfe0f5;text-transform:uppercase;letter-spacing:.4px}
  .countdown .cd-sep{color:#cfe0f5;opacity:.6;font-weight:800}

  /* PROVENANCE LEGEND */
  .legend{display:flex;gap:12px;flex-wrap:wrap;padding:8px 18px;background:var(--bg);font-size:10.5px;color:var(--muted);font-weight:600}
  .legend span{display:flex;align-items:center;gap:5px}
  .dot{width:8px;height:8px;border-radius:50%;display:inline-block}
  .dot.g{background:var(--green)}.dot.a{background:var(--amber)}.dot.b{background:var(--link)}

  .nav{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.96);backdrop-filter:saturate(180%) blur(12px);border-top:1px solid var(--line);z-index:50}
  .nav-inner{max-width:520px;margin:0 auto;display:flex;height:60px}
  .nav a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--muted);text-decoration:none;font-size:10px;font-weight:600}
  .nav a svg{width:22px;height:22px}
  .nav a.on{color:var(--su)}
  .nav a.on svg{stroke:var(--su)}

  .screen{display:none;padding:14px 14px 20px}
  .screen.on{display:block}
  .card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
  .muted{color:var(--muted);font-size:13px}.small{font-size:12px}
  .label{font-size:11px;text-transform:uppercase;letter-spacing:.8px;font-weight:700;color:var(--muted)}
  .row{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .section-title{font-size:13px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--su);margin:18px 4px 8px;display:flex;align-items:center;gap:6px}
  .section-title svg{width:16px;height:16px;stroke:var(--su)}

  /* NEXT MATCH DASHBOARD */
  .next{border-radius:20px;overflow:hidden;background:var(--card);box-shadow:var(--shadow);margin-bottom:12px;border-top:5px solid var(--su)}
  .next .head{background:var(--su-soft);padding:9px 16px;display:flex;justify-content:space-between;align-items:center}
  .next .head .who{font-size:12px;font-weight:800;color:var(--su);letter-spacing:.3px;text-transform:uppercase}
  .next .head .status{font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px}
  .status.conf{background:var(--green-bg);color:var(--green)}
  .status.pend{background:var(--amber-bg);color:var(--amber)}
  .next .body{padding:16px 18px}
  .next .day{font-size:13px;font-weight:800;color:var(--su);text-transform:uppercase;letter-spacing:.6px}
  .next .time{font-size:54px;font-weight:800;letter-spacing:-2.5px;line-height:1;margin:2px 0}
  .next .vs{font-size:17px;font-weight:700;margin:4px 0}
  .next .meta-line{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 0}
  .pill{font-size:12px;font-weight:700;padding:4px 12px;border-radius:20px;background:var(--su-soft);color:var(--su)}
  .pill.field{background:var(--su);color:#fff}
  .pill.away{background:var(--bg);color:var(--muted)}
  .next .arrive{margin-top:12px;padding-top:10px;border-top:1px dashed var(--line);font-size:13px;color:var(--muted)}
  .next .arrive b{color:var(--ink)}
  .next .arrive .pend{color:var(--amber);font-weight:600}
  .next .wx-mini{margin-top:10px;padding:10px 12px;background:var(--amber-bg);border-radius:10px;font-size:12.5px;font-weight:600;color:var(--amber);display:flex;justify-content:space-between;align-items:center;gap:8px}
  .next .wx-mini .exp{color:var(--link);font-weight:700;white-space:nowrap}

  .btn-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px}
  .btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:13px 6px;border-radius:12px;background:var(--su);color:#fff;text-decoration:none;font-size:11px;font-weight:700;text-align:center}
  .btn svg{width:22px;height:22px}
  .btn.ghost{background:var(--su-soft);color:var(--su)}

  .wx-full{display:none}
  .wx-full.open{display:block}
  .wx{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .wxcard{border-radius:14px;padding:14px;color:#fff}
  .wxcard .wd{font-size:12px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;opacity:.85}
  .wxcard .wt{font-size:34px;font-weight:800;letter-spacing:-1.5px;margin:2px 0 0}
  .wxcard .wf{font-size:12px;font-weight:600;opacity:.9;margin-bottom:8px}
  .wxcard .wrow{font-size:11.5px;display:flex;justify-content:space-between;padding:3px 0;border-top:1px solid rgba(255,255,255,.18)}
  .wxcard .wrow b{font-weight:700}

  .watch{border-radius:14px;overflow:hidden;margin-bottom:14px;box-shadow:var(--shadow)}
  .watch .wh{background:var(--su-dark);color:#fff;padding:9px 14px;font-size:11px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;display:flex;align-items:center;gap:7px}
  .watch .wh svg{width:16px;height:16px}
  .watch .wb{display:grid;background:var(--card)}
  .watch .wcell{padding:13px 14px;border-bottom:1px solid var(--line)}
  .watch .wcell:last-child{border-bottom:none}
  .watch .wcell .wt{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.4px}
  .watch .wcell .wv{font-size:24px;font-weight:800;letter-spacing:-1px;margin:2px 0}
  .watch .wcell .ws{font-size:11px;color:var(--muted)}
  .watch .wfoot{background:var(--card);border-top:1px solid var(--line);padding:9px 14px;text-align:center}
  .watch .wfoot a{color:var(--link);font-weight:700;text-decoration:none;font-size:12.5px}

  .need{border-radius:16px;padding:15px 16px;margin-bottom:14px;color:#fff;box-shadow:var(--shadow);background:linear-gradient(150deg,#0055A4,#003f7a)}
  .need .nh{font-size:11px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;opacity:.85;display:flex;align-items:center;gap:7px;margin-bottom:9px}
  .need .nh svg{width:15px;height:15px}
  .need ul{margin:0;padding:0;list-style:none}
  .need li{font-size:13.5px;font-weight:600;padding:4px 0;display:flex;align-items:center;gap:9px}
  .need li::before{content:"";width:5px;height:5px;border-radius:50%;background:#fff;opacity:.6;flex-shrink:0}

  .daycard{border-radius:18px;overflow:hidden;background:var(--card);box-shadow:var(--shadow);margin-bottom:14px}
  .daycard .dh{padding:11px 16px;color:#fff;font-weight:800;font-size:15px;display:flex;justify-content:space-between;align-items:center}
  .daycard .dh .dd{font-size:11px;font-weight:600;opacity:.85}
  .daycard .g{padding:14px 16px;border-top:1px solid var(--line)}
  .daycard .g:first-of-type{border-top:none}
  .g .grow{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .g .gtime{font-size:24px;font-weight:800;letter-spacing:-1px}
  .g .gvs{font-size:13.5px;font-weight:600}
  .g .gmeta{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
  .g .ghome{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
  .gap{border-left:3px solid var(--amber);background:var(--amber-bg);padding:9px 14px;font-size:12px;color:var(--amber);font-weight:700;display:flex;align-items:center;gap:7px}
  .gap svg{width:16px;height:16px}
  .final{border:2px dashed var(--amber);background:var(--amber-bg);border-radius:14px;padding:13px 16px;margin-top:2px}
  .final .ftag{font-size:11px;font-weight:800;color:var(--amber);letter-spacing:.5px;text-transform:uppercase;display:flex;align-items:center;gap:6px}
  .final .ftag svg{width:15px;height:15px}
  .final .ftime{font-size:24px;font-weight:800;letter-spacing:-1px;margin:3px 0}
  .final .fnote{font-size:12px;color:var(--amber);margin-top:4px}

  .ourwk{display:flex;align-items:center;gap:6px;justify-content:center;padding:12px;background:var(--su);border-radius:12px;color:#fff;margin-top:12px}
  .ourwk .ow{font-size:13px;font-weight:800}
  .ourwk .owl{font-size:10px;opacity:.85;font-weight:600}
  .ourwk .arr{font-size:16px;opacity:.7}

  .tap{display:flex;align-items:center;gap:12px;padding:13px 4px;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink)}
  .tap:last-child{border-bottom:none}
  .tap .ic{width:40px;height:40px;border-radius:12px;background:var(--su-soft);color:var(--su);display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .tap .ic svg{width:21px;height:21px}
  .tap .tt{flex:1}
  .tap .tt .tl{font-size:14px;font-weight:700}
  .tap .tt .ts{font-size:12px;color:var(--muted)}
  .tap .dist{font-size:12px;font-weight:700;color:var(--link);text-align:right;flex-shrink:0}
  .tap .dist .d{display:block;font-size:9px;color:var(--muted);font-weight:600}

  .amenities{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .amenity{display:flex;align-items:center;gap:8px;background:var(--bg);border-radius:10px;padding:9px 11px;font-size:12.5px;font-weight:600}
  .amenity svg{width:17px;height:17px;color:var(--green);stroke:var(--green)}

  .tl{position:relative;padding-left:26px;margin-top:6px}
  .tl::before{content:"";position:absolute;left:9px;top:6px;bottom:6px;width:2px;background:var(--line)}
  .tlstep{position:relative;padding:6px 0 6px 6px}
  .tlstep::before{content:"";position:absolute;left:-22px;top:12px;width:10px;height:10px;border-radius:50%;background:var(--su);border:2px solid #fff;box-shadow:0 0 0 2px var(--su)}
  .tlstep .tt{font-size:13px;font-weight:700}
  .tlstep .ts{font-size:12px;color:var(--muted)}
  .tlstep .tk{font-size:11px;font-weight:800;color:var(--su)}

  .chkgrp{margin-bottom:14px}
  .chkgrp h4{margin:0 0 8px;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--su)}
  .chk{display:flex;align-items:center;gap:11px;padding:9px 4px;border-bottom:1px solid var(--line);font-size:14px;cursor:pointer}
  .chk:last-child{border-bottom:none}
  .chk .box{width:24px;height:24px;border-radius:7px;border:2px solid #c7cdd6;flex-shrink:0;display:flex;align-items:center;justify-content:center}
  .chk.done .box{background:var(--green);border-color:var(--green)}
  .chk.done .box svg{width:15px;height:15px;stroke:#fff}
  .chk.done .chkname{color:var(--muted);text-decoration:line-through}
  .progress{height:8px;border-radius:6px;background:var(--line);overflow:hidden;margin:4px 0 12px}
  .progress i{display:block;height:100%;background:var(--green);transition:width .2s}

  .contact{display:flex;align-items:center;gap:12px;padding:11px 2px;border-bottom:1px solid var(--line)}
  .contact:last-child{border-bottom:none}
  .contact .ci{width:40px;height:40px;border-radius:50%;background:var(--su-soft);color:var(--su);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;flex-shrink:0}
  .contact .cn{flex:1}
  .contact .cn .cnm{font-size:14px;font-weight:700}
  .contact .cn .crl{font-size:11.5px;color:var(--muted)}
  .contact a{background:var(--su);color:#fff;text-decoration:none;font-size:11px;font-weight:700;padding:6px 12px;border-radius:9px;flex-shrink:0}

  .quickrules{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .qr{background:var(--bg);border-radius:10px;padding:10px 12px}
  .qr .qrv{font-size:14px;font-weight:800}
  .qr .qrl{font-size:11px;color:var(--muted)}
  details.acc{border-radius:12px;overflow:hidden;margin-top:10px;background:var(--bg)}
  details.acc summary{padding:12px 14px;font-size:13px;font-weight:700;cursor:pointer;color:var(--su);list-style:none;display:flex;justify-content:space-between;align-items:center}
  details.acc summary::-webkit-details-marker{display:none}
  details.acc[open] summary{background:var(--su-soft)}
  details.acc .accbody{padding:4px 14px 14px;font-size:13px}
  .ruleline{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}
  .ruleline:last-child{border-bottom:none}
  .ruleline b{font-weight:700;color:var(--su)}

  .updated-banner{background:var(--card);border-radius:12px;padding:11px 14px;margin-bottom:12px;box-shadow:var(--shadow);font-size:12.5px;display:flex;align-items:center;gap:9px}
  .updated-banner svg{width:17px;height:17px;color:var(--link);stroke:var(--link);flex-shrink:0}
  .updated-banner a{color:var(--link);font-weight:700;text-decoration:none}

  .fullguide{border-radius:14px;background:linear-gradient(150deg,var(--su),var(--su-dark));color:#fff;padding:16px;margin-bottom:14px;text-decoration:none;display:block}
  .fullguide .fg1{font-size:14px;font-weight:800;margin-bottom:3px}
  .fullguide .fg2{font-size:12px;opacity:.85;margin-bottom:10px}
  .fullguide .fgb{display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.16);padding:8px 14px;border-radius:10px;font-size:12px;font-weight:700}
  .alert{border-radius:14px;padding:12px 14px;margin-bottom:14px;font-size:13px;font-weight:600;display:flex;gap:10px;align-items:flex-start}
  .alert svg{width:20px;height:20px;flex-shrink:0}
</style>
</head>
<body>
<div class="app">

  <header class="hero">
    <div class="crest" aria-hidden="true" id="crestMark"></div>
    <p class="kick" id="heroKick"></p>
    <h1 id="heroTitle"></h1>
    <p class="team" id="heroTeam"></p>
    <p class="meta" id="heroMeta"></p>
  </header>

  <div class="context">
    <span id="ctxText"></span>
    <span class="chip" id="ctxChip"></span>
  </div>

  <!-- LIVE COUNTDOWN -->
  <div class="countdown" id="countdown">
    <span class="cd-label" id="cdLabel"></span>
    <span id="cdBody"></span>
  </div>

  <div class="legend">
    <span><span class="dot g"></span>Confirmed</span>
    <span><span class="dot a"></span>Coach pending</span>
    <span><span class="dot b"></span>Guide recommendation</span>
  </div>

  <!-- WEEKEND STATUS (compact progress) -->
  <div id="weekendStatus" style="display:flex;flex-wrap:wrap;gap:6px;justify-content:center;padding:10px 14px;background:var(--card);border-bottom:1px solid var(--line);font-size:10.5px;font-weight:700;color:var(--muted)"></div>

  <main>
    <section class="screen on" id="scr-today">
      <div class="updated-banner" id="updBanner"></div>
      <div class="next">
        <div class="head"><span class="who">Next Match</span><span class="status conf" id="nextStatus"></span></div>
        <div class="body" id="nextBody"></div>
      </div>
      <div class="need">
        <div class="nh"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v2M12 19v2M3 12h2M19 12h2"/><circle cx="12" cy="12" r="4"/></svg><span id="needTitle"></span></div>
        <ul id="needList"></ul>
      </div>
      <div class="wx-full" id="wxFull"></div>
      <div class="watch" id="watchCard"></div>
    </section>

    <section class="screen" id="scr-schedule">
      <h1 style="font-size:20px;margin:2px 0 4px;font-weight:800">Schedule</h1>
      <p class="muted" id="schedVenueLine" style="margin:0 0 12px"></p>
      <div id="scheduleDays"></div>
      <div id="ourWeekend"></div>
    </section>

    <section class="screen" id="scr-venue">
      <h1 style="font-size:20px;margin:2px 0 4px;font-weight:800">Venue</h1>
      <div id="venueCard"></div>
      <div class="section-title"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6M10 3v6l-4 9a3 3 0 0 0 2.6 1.5h6.8A3 3 0 0 0 18 18l-4-9V3"/></svg>Our Fields</div>
      <div id="fieldsCard"></div>
      <div class="section-title"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 13h16M5 20v-7M19 20v-7M5 13V6a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v7"/></svg>Parking &amp; Amenities</div>
      <div id="venueInfoCard"></div>
    </section>

    <section class="screen" id="scr-pack">
      <div class="row" style="margin:2px 0 4px">
        <h1 style="font-size:20px;margin:0;font-weight:800">Packing</h1>
        <button onclick="resetPack()" style="border:1px solid var(--line);background:var(--card);color:var(--muted);font-size:12px;font-weight:700;padding:6px 12px;border-radius:20px;cursor:pointer">Reset Checklist</button>
      </div>
      <div class="alert" id="packAlert" style="background:var(--su);color:#fff;align-items:center"></div>
      <div class="card" style="padding-bottom:10px">
        <div class="row"><span class="muted small" id="packCount">0 of 0</span><span class="muted small">Saved on this phone</span></div>
        <div class="progress"><i id="packBar" style="width:0%"></i></div>
        <div id="packLists"></div>
      </div>
    </section>

    <section class="screen" id="scr-more">
      <a class="fullguide" id="fullGuideLink" href="#"><div class="fg1" id="fg1"></div><div class="fg2" id="fg2"></div><span class="fgb"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3v4a1 1 0 0 0 1 1h4"/><path d="M17 21H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7l5 5v11a2 2 0 0 1-2 2z"/></svg>Open full guide</span></a>
      <div class="section-title"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18M5 21V7l8-4v18M19 21V11l-6-4"/></svg>Hotels</div>
      <div id="hotelsSection"></div>
      <div id="breakSection"></div>
      <div id="nearbySection"></div>
      <div id="contactsSection"></div>
      <div id="rulesSection"></div>
      <div id="changesSection"></div>
    </section>
  </main>

  <nav class="nav">
    <div class="nav-inner">
      <a href="#" data-goto="today" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg>Today</a>

/* ---------- data.json -> TOURNAMENT adapter ---------- */
function fieldNum(f){ var m=String(f||'').match(/(\d+)/); return m?parseInt(m[1],10):0; }
function dayLabel(iso){
  try{ var d=new Date(iso+'T12:00:00');
    return d.toLocaleDateString('en-US',{weekday:'long',timeZone:TOURNAMENT.timezone})+' · '
         + d.toLocaleDateString('en-US',{month:'long',timeZone:TOURNAMENT.timezone})+' '+d.getDate();
  }catch(e){ return iso; }
}
function hhmm(t){ var m=String(t||'').match(/(\d{1,2}):(\d{2})\s*(AM|PM)/i); return m?(m[1]+':'+m[2]+' '+m[3].toUpperCase()):String(t||''); }
function isoDT(date,t){
  var m=String(t||'').match(/(\d{1,2}):(\d{2})\s*(AM|PM)/i); if(!m||!date) return date||'';
  var h=parseInt(m[1],10), ap=(m[3]||'').toUpperCase();
  if(ap==='PM'&&h!==12) h+=12; if(ap==='AM'&&h===12) h=0;
  return date+'T'+(h<10?'0':'')+h+':'+m[2]+':00-04:00';
}

function adaptData(d){
  var T=TOURNAMENT;
  try{
    if(d.team && d.team.name){
      T.tournament.team=(d.team.shortName||d.team.name)+' · U9 · 7v7';
    }
    if(d.tournament){
      if(d.tournament.name) T.tournament.name=d.tournament.name;
      if(d.tournament.shortName) T.tournament.meta=d.tournament.shortName.toUpperCase()+' · '+T.tournament.meta.split('·').pop().trim();
    }
    if(d.offline && d.offline.pdfGuideUrl) T.tournament.fullGuideUrl=d.offline.pdfGuideUrl;

    // games
    if(Array.isArray(d.games) && d.games.length){
      T.games=d.games.map(function(g,i){
        return {
          id:g.id||('game'+(i+1)),
          label:(g.type==='final')?'Final':('Game '+(i+1)),
          datetime:isoDT(g.date,g.time),
          dayLabel:dayLabel(g.date),
          time:hhmm(g.time),
          opponent:g.opponent||'TBD',
          field:fieldNum(g.field),
          home:null,
          arrival:g.arrival||'',
          arrivalStatus:'confirmed',
          status:g.status||'scheduled',
          type:g.type||'group'
        };
      });
      T.venue.ourFields=T.games.map(function(g,i){ return {f:g.field||'?', label:g.dayLabel.split('·')[0].trim().slice(0,3).toUpperCase()+' · G'+(i+1)}; });
    }

    // venue
    if(d.venue){
      if(d.venue.name) T.venue.name=d.venue.name;
      if(d.venue.address){
        // data.json carries a full address ("1009 Bickley Road, Irmo, SC 29063").
        // Split it so the renderer doesn't append the city a second time.
        var parts=d.venue.address.split(',');
        if(parts.length>=3){
          T.venue.city=parts.slice(-2).join(',').trim();
          T.venue.address=parts.slice(0,-2).join(',').trim();
        }else{
          T.venue.address=d.venue.address;
        }
      }
      if(d.venue.mapsUrl) T.venue.mapsUrl=d.venue.mapsUrl;
      if(d.venue.parking) T.venue.parking=d.venue.parking;
      if(d.venue.fields && d.venue.fields.map) T.venue.fieldMapUrl=d.venue.fields.map;
      if(d.venue.amenities){
        var a=d.venue.amenities, out=[];
        if(a.restrooms) out.push('Restrooms');
        if(a.concessions) out.push('Concessions');
        if(a.shade) out.push('Shade: '+a.shade);
        if(out.length) T.venue.amenities=out;
      }
    }

    // schedule-pending copy
    if(d.scheduleExpected) T.schedulePending.detail=d.scheduleExpected;

    // weather note
    if(d.weather && d.weather.summary) T.weather.mini={ day:'Outlook', temp:'80°', feels:'low 63°', storm:'seasonal' };

    // hotels
    if(d.hotels){
      var hs=[];
      (d.hotels.official||[]).forEach(function(h){ hs.push({name:h.name, chain:h.chain, rate:h.rate, drive:h.drive, best:!!h.bestValue, tier:'pick', amenities:h.amenities||[]}); });
      (d.hotels.nonOfficial||[]).forEach(function(h){ hs.push({name:h.name, chain:h.chain, rate:'', drive:h.drive, best:false, tier:'alt', note:h.note||''}); });
      T.hotels=hs;
    }

    // nearby
    if(d.nearby){
      var groups=[]; var cur=[];
      ['urgentCare','target','dicks','pharmacy','coffee'].forEach(function(k){
        var v=d.nearby[k]; if(!v||!v.name) return;
        cur.push({ name:v.name, note:(v.address||v.drive||''), dist:(v.drive||''), sub:'', url:(v.maps||'#'), icon:'shop' });
      });
      if(cur.length) groups.push({label:'Essentials & Emergency', items:cur});
      if(T.nearby.groups && T.nearby.groups.length) groups=groups.concat(T.nearby.groups.slice(2));
      T.nearby.groups=groups;
    }

    // rules
    if(d.rules){
      if(Array.isArray(d.rules.keyRules) && d.rules.keyRules.length){
        T.rules.quick=d.rules.keyRules.slice(0,6).map(function(r){ return {v:String(r.value).split('·')[0].trim(), l:String(r.label).toLowerCase()}; });
        T.rules.full=d.rules.keyRules.map(function(r){ return {k:r.label, v:r.value}; });
      }
      if(Array.isArray(d.rules.tiebreakers)) T.rules.tiebreakers=d.rules.tiebreakers;
      if(d.rules.tiebreakersPending) T.rules.tiebreakersPending=d.rules.tiebreakersPending;
      if(d.rules.fullLink) T.rules.fullRulesUrl=d.rules.fullLink;
    }

    // packing
    if(d.checklist){
      var G=[]; var map={player:'Player',weather:'Weather',parent:'Sideline',emergency:'Emergency'};
      ['player','weather','parent','emergency'].forEach(function(k){
        if(Array.isArray(d.checklist[k]) && d.checklist[k].length){
          G.push({kind:(k==='weather'?'weather':'always'), title:map[k], items:d.checklist[k].map(function(x){ return [x,null]; })});
        }
      });
      if(G.length) T.packing.groups=G;
    }

    // contacts
    if(d.contacts){
      var C=[]; var c=d.contacts.coach, mgr=d.contacts.manager;
      if(c&&c.name) C.push({name:c.name, role:'Head Coach · Soccer / team', phone:(c.phone||'').replace(/[^0-9]/g,''), initial:c.name.charAt(0)});
      if(mgr&&mgr.name) C.push({name:mgr.name, role:mgr.role||'Parent Team Manager', phone:(mgr.phone||'').replace(/[^0-9]/g,''), initial:mgr.name.charAt(0)});
      (d.contacts.teamManagers||[]).forEach(function(m){ C.push({name:m.name, role:'Team Manager', phone:(m.phone||'').replace(/[^0-9]/g,''), initial:m.name.charAt(0)}); });
      var td=d.contacts.tournamentDirector;
      if(td&&(td.name||td.email)) C.push({name:td.name||'Tournament HQ', role:(td.email||'')+' · lost kid / injury / venue emergency', phone:(td.phone||'').replace(/[^0-9]/g,''), initial:'H'});
      C.push({name:'Team Updates', role:'PlayMetrics', url:'https://playmetrics.com', initial:'P'});
      T.contacts=C;
    }

    // changes / updates
    if(Array.isArray(d.updates) && d.updates.length){
      T.changes=d.updates.slice(0,6).map(function(u){ return {k:u.title, v:u.description}; });
    }
  }catch(e){ /* keep fallback on any shape mismatch */ }
}

// ---- TOURNAMENT STATE RESOLVER (single source of truth for time) ----
const TZ=TOURNAMENT.timezone;
const DURATION=(TOURNAMENT.matchDurationMin||60)*60000; // active-match window
function tzNow(){return new Date();}
function tzTime(iso){return new Date(iso);}
function fmtParts(diff){
  diff=Math.max(0,diff);
  const days=Math.floor(diff/86400000),hours=Math.floor((diff%86400000)/3600000),mins=Math.floor((diff%3600000)/60000);
  return {days,hours,mins};
}
/* Resolve the full tournament state from data + now. Everything downstream
   (countdown, Next Match, context, Today) consumes this ONE result, so they
   can never disagree. Fully generic — knows nothing about any specific
   tournament. */
function resolveTournamentState(t, now){
  const travel=t.travel?{...t.travel,start:tzTime(t.travel.date+"T00:00:00-04:00")}:null;
  // Derive each game's active window [start, end] from data (or duration)
  const games=(t.games||[]).map(g=>{
    const start=tzTime(g.datetime);
    const end=g.end?tzTime(g.end):new Date(start.getTime()+DURATION);
    return {...g,start,end};
  });
  // Only "active" games (confirmed, or conditional that has been confirmed) count toward next/current
  const eligible=games.filter(g=>g.status==='confirmed'||(g.status==='conditional'&&g.confirmed));
  // Determine each game's state
  const withState=games.map(g=>{
    let st;
    if(g.status==='cancelled') st='cancelled';
    else if(g.status==='postponed') st='postponed';
    else if(g.status==='conditional'&&!g.confirmed) st='conditional';
    else if(now<g.start) st='upcoming';
    else if(now<g.end) st='current';
    else st='completed';
    return {...g,state:st};
  });
  const currentMatch=withState.find(g=>g.state==='current')||null;
  const nextMatch=withState.find(g=>g.state==='upcoming')||null;
  // Countdown target = the next event boundary. If a match is live, count its remaining window;
  // else the next eligible start; travel is the earliest milestone.
  let countdownTarget=null,countdownLabel='',phase;
  // No games published yet — count down to travel day instead of claiming it's over.
  if(!TOURNAMENT.games||!TOURNAMENT.games.length){
    phase='awaiting-schedule';
    if(travel&&now<travel.start){ countdownTarget=travel.start; countdownLabel='UNTIL TRAVEL DAY'; }
    else { countdownTarget=null; countdownLabel='AWAITING SCHEDULE'; }
    return {now,phase,currentMatch:null,nextMatch:null,countdownTarget,countdownLabel,travel,games,withState};
  }
  if(currentMatch){
    phase='in-match';
    countdownTarget=currentMatch.end;
    countdownLabel=currentMatch.label.toUpperCase()+' · HAPPENING NOW';
  } else if(nextMatch){
    if(travel&&now<travel.start){ phase='pre-tournament'; countdownTarget=nextMatch.start; countdownLabel='UNTIL KICKOFF'; }
    else if(travel&&now<new Date(travel.start.getTime()+24*3600000)){ phase='travel'; countdownTarget=nextMatch.start; countdownLabel='UNTIL KICKOFF'; }
    else { phase='between-games'; countdownTarget=nextMatch.start; countdownLabel='UNTIL '+nextMatch.label.toUpperCase(); }
  } else {
    // No current or upcoming match. If there's a still-pending conditional final whose
    // scheduled time hasn't fully passed, we're waiting on a bracket result.
    const pendFinal=withState.find(g=>g.state==='conditional');
    if(pendFinal&&now<pendFinal.end){ phase='awaiting-final'; countdownTarget=null; countdownLabel='AWAITING BRACKET RESULT'; }
    else { phase='complete'; countdownTarget=null; countdownLabel='TOURNAMENT COMPLETE'; }
  }
  return {now,phase,currentMatch,nextMatch,countdownTarget,countdownLabel,travel,games,withState};
}

// ---- LIVE COUNTDOWN (consumes resolver) ----
const cdLabel=document.getElementById('cdLabel'),cdBody=document.getElementById('cdBody');
function renderCountdown(state){
  cdLabel.textContent=state.countdownLabel||'';
  if(!state.countdownTarget){ cdBody.innerHTML=''; return; }
  const p=fmtParts(state.countdownTarget-state.now);
  let html;
  if(p.days>0) html='<span class="cd-num num">'+p.days+'</span><span class="cd-unit">d</span><span class="cd-sep">·</span><span class="cd-num num">'+p.hours+'</span><span class="cd-unit">hr</span><span class="cd-sep">·</span><span class="cd-num num">'+p.mins+'</span><span class="cd-unit">min</span>';
  else if(p.hours>0) html='<span class="cd-num num">'+p.hours+'</span><span class="cd-unit">hr</span><span class="cd-sep">·</span><span class="cd-num num">'+p.mins+'</span><span class="cd-unit">min</span>';
  else html='<span class="cd-num num">'+p.mins+'</span><span class="cd-unit">min</span>';
  cdBody.innerHTML=html;
}

// ---- CONTEXT + NEED-NOW (consumes resolver) ----
const ctxText=document.getElementById('ctxText'),ctxChip=document.getElementById('ctxChip');
const needTitle=document.getElementById('needTitle'),needList=document.getElementById('needList');
function refreshContext(state){
  const {phase,currentMatch,nextMatch,travel,now}=state;
  const g1=TOURNAMENT.games[0];
  let txt,chip,need='before';
  switch(phase){
    case 'pre-tournament':
      const days=Math.max(0,Math.round((tzTime(g1.datetime).getTime()-new Date(now.getFullYear(),now.getMonth(),now.getDate()).getTime())/86400000));
      const wd=travel?new Date(travel.start.getTime()).toLocaleDateString('en-US',{weekday:'long',timeZone:TZ}):'';
      txt=(days>0?days+' DAYS TO KICKOFF':'TODAY · GAME DAY'); chip=(travel?travel.label+' · '+wd:'Game Day'); need='before'; break;
    case 'travel': txt='TRAVEL DAY'; chip=travel.detail||travel.label; need='travel'; break;
    case 'in-match': txt='HAPPENING NOW'; chip=currentMatch.label+' · '+currentMatch.time+' · Field '+currentMatch.field; need='game1'; break;
    case 'between-games': txt='BETWEEN GAMES'; chip=nextMatch?nextMatch.label+' · '+nextMatch.time:'Next match'; need='between'; break;
    case 'awaiting-final': txt='AWAITING BRACKET RESULT'; chip='Final qualification not yet confirmed'; need='game3'; break;
    case 'awaiting-schedule': txt='SCHEDULE PENDING'; chip='Brackets Sep 16 · Schedule Sep 24'; need='before'; break;
    case 'complete': txt='TOURNAMENT COMPLETE'; chip='Great weekend!'; need='before'; break;
    default: txt='GAME DAY'; chip=nextMatch?nextMatch.label+' · '+nextMatch.time:'Next match'; need='game1';
  }
  ctxText.textContent=txt; ctxChip.textContent=chip;
  const needKey=need==='travel'?'travel':need==='between'?'between':need==='game1'?'game1':need==='game3'?'game3':'before';
  const list=(TOURNAMENT.needs[needKey]||TOURNAMENT.needs.before);
  let needTitleText='Before Friday';

// ---- MASTER REFRESH: countdown ticks fast, full state re-resolves on a slower cadence ----
let lastStateKey='';
function refreshAll(){
  const state=resolveTournamentState(TOURNAMENT,tzNow());
  // Countdown is cheap — run every second. Full re-render only when state changes.
  const key=state.phase+'|'+(state.currentMatch?state.currentMatch.id:'')+'|'+(state.nextMatch?state.nextMatch.id:'');
  renderCountdown(state);
  if(key!==lastStateKey){ lastStateKey=key; refreshContext(state); renderNextMatch(state); renderSchedule(state); renderWeekendStatus(state); }
}

// ---- WEEKEND STATUS (compact progress derived from state) ----
function renderWeekendStatus(state){
  const st=state||resolveTournamentState(TOURNAMENT,tzNow());
  const el=document.getElementById('weekendStatus');if(!el)return;
  const curId=st.currentMatch?st.currentMatch.id:null,nextId=st.nextMatch?st.nextMatch.id:null;
  const parts=[];
  const travel=TOURNAMENT.travel;
  if(travel){
    const tStart=tzTime(travel.date+"T00:00:00-04:00");
    const tDone=st.now>new Date(tStart.getTime()+24*3600000);
    parts.push('<span>'+travel.label+' '+(tDone?'<span style="color:var(--green)">✓</span>':'<span style="color:var(--su)">●</span>')+'</span>');
  }
  const byDay={};
  TOURNAMENT.games.forEach(g=>{(byDay[g.dayLabel]=byDay[g.dayLabel]||[]).push(g);});
  for(const [day,games] of Object.entries(byDay)){
    const dayShort=day.split('·')[0].trim().slice(0,3);
    let cell=dayShort+' ';
    cell+=games.map(g=>{
      const done=st.withState.find(x=>x.id===g.id)?.state==='completed';
      const live=g.id===curId;
      const nxt=g.id===nextId;
      const gnum=TOURNAMENT.games.findIndex(x=>x.id===g.id)+1;
      const sym=g.type==='final'?'◇':(gnum>0?'G'+gnum:'?');
      if(done)return '<span style="color:var(--green)">'+sym+'✓</span>';
      if(live)return '<span style="color:var(--red)">'+sym+'●</span>';
      if(nxt)return '<span style="color:var(--su)">'+sym+'●</span>';
      return '<span style="opacity:.45">'+sym+'</span>';
    }).join(' ');
    parts.push('<span>'+cell+'</span>');
  }
  el.innerHTML=parts.join('<span style="opacity:.25">·</span>');
}

// ---- LIVE WEATHER (fetches fresh forecast for the game dates) ----
function loadWeather(){
  const src=TOURNAMENT.weather.source;
  if(!src||!src.enabled) return; // keep static data as fallback
  const url='https://api.open-meteo.com/v1/forecast'
    +'?latitude='+src.lat+'&longitude='+src.lng
    +'&daily=temperature_2m_max,apparent_temperature_max,precipitation_probability_max,precipitation_sum'
    +'&temperature_unit=fahrenheit&precipitation_unit=inch&wind_speed_unit=mph'
    +'&timezone='+encodeURIComponent(src.timezone||TOURNAMENT.timezone)
    +'&forecast_days=8';
  fetch(url).then(r=>r.json()).then(data=>{
    const daily=data.daily||{};
    const times=daily.time||[];
    // Map each game's date (YYYY-MM-DD) to the matching forecast day
    const gameDates=TOURNAMENT.games.map(g=>g.datetime.slice(0,10));
    const byGame={};
    gameDates.forEach((d,i)=>{ const idx=times.indexOf(d); byGame[TOURNAMENT.games[i].id]=idx>=0?idx:null; });
    // Build day cards for unique game dates that have forecast data
    const seen={}; const days=[];
    TOURNAMENT.games.forEach(g=>{
      const idx=byGame[g.id]; if(idx==null||seen[g.datetime.slice(0,10)])return; seen[g.datetime.slice(0,10)]=true;
      const high=Math.round(daily.temperature_2m_max[idx]);
      const feels=Math.round(daily.apparent_temperature_max[idx]);
      const storm=Math.round(daily.precipitation_probability_max[idx]);
      const rain=+(daily.precipitation_sum[idx]||0).toFixed(2);
      const isSun=TOURNAMENT.games.find(x=>x.datetime.slice(0,10)===g.datetime.slice(0,10)&&x.id!==g.id)||g.datetime.slice(0,10)>=TOURNAMENT.games.find(x=>x.type!=='final').datetime.slice(0,10);
      const dayName=new Date(g.datetime).toLocaleDateString('en-US',{weekday:'long',timeZone:src.timezone||TOURNAMENT.timezone});
      const concern=feels>=100?'Extreme heat':storm>=70?'High storm risk':storm>=40?'Storms possible':'Mostly clear';
      days.push({ label:dayName, high:high+'°', feels:'Feels '+feels+'°', storm:storm+'%', concern, className:dayName==='Sunday'?'sun':'sat', rain });
    });
    // Pick the next game's day for the mini line
    const state=resolveTournamentState(TOURNAMENT,tzNow());
    const nextGame=(state.nextMatch||TOURNAMENT.games[0]);
    const idx=byGame[nextGame.id];
    let mini=TOURNAMENT.weather.mini;
    if(idx!=null&&daily.temperature_2m_max&&daily.apparent_temperature_max&&daily.precipitation_probability_max){
      const t=Math.round(daily.temperature_2m_max[idx]),f=Math.round(daily.apparent_temperature_max[idx]),st=Math.round(daily.precipitation_probability_max[idx]);
      const dayName=new Date(nextGame.datetime).toLocaleDateString('en-US',{weekday:'long',timeZone:src.timezone||TOURNAMENT.timezone});
      mini={ day:dayName, temp:t+'°', feels:'feels '+f+'°', storm:'storm '+st+'%' };
    }
    // Build watch cells from the two most relevant concerns
    const watch=[];
    if(days.length){
      const hottest=[...days].sort((a,b)=>parseInt(b.feels.replace(/\D/g,''))-parseInt(a.feels.replace(/\D/g,'')))[0];
      const stormiest=[...days].sort((a,b)=>parseInt(b.storm)-parseInt(a.storm))[0];
      watch.push({ title:'Extreme Heat · '+hottest.label.slice(0,3), value:hottest.feels.replace('Feels ','')+'F', sub:'feels like · stay hydrated', cls:'hot' });
      watch.push({ title:'Storm Risk · '+stormiest.label.slice(0,3), value:stormiest.storm, sub:'chance · expect delays', cls:'storm' });
    }
    if(days.length){ TOURNAMENT.weather.days=days; }
    TOURNAMENT.weather.mini=mini;
    if(watch.length){ TOURNAMENT.weather.watch=watch; }
    const now=new Date();
    TOURNAMENT.weather.updated='Live · '+now.toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit',timeZone:src.timezone||TOURNAMENT.timezone})+' ET';
    renderWeather();
    // Weather feeds the Next Match mini-line, so re-render it too (state key may be unchanged).
    refreshAll();
    renderNextMatch(resolveTournamentState(TOURNAMENT,tzNow()));
  }).catch(()=>{ /* keep static fallback on failure */ });
}

// ---- SCHEDULE (uses resolver to highlight NOW / NEXT) ----
function renderSchedule(state){
  const st=state||resolveTournamentState(TOURNAMENT,tzNow());
  const currentId=st.currentMatch?st.currentMatch.id:null;
  const nextId=st.nextMatch?st.nextMatch.id:null;
  document.getElementById('schedVenueLine').textContent='All games at '+TOURNAMENT.venue.name+' · '+TOURNAMENT.venue.address+', '+TOURNAMENT.venue.city;
  const byDay={};
  TOURNAMENT.games.forEach(g=>{(byDay[g.dayLabel]=byDay[g.dayLabel]||[]).push(g);});
  let out='';
  for(const [day,games] of Object.entries(byDay)){
    const isSat=day.toLowerCase().includes('saturday');
    out+='<div class="daycard '+(isSat?'sat':'sun')+'"><div class="dh"><span>'+day+'</span><span class="dd">'+games.map(g=>g.label).join(' + ')+'</span></div>';
    games.forEach((g,i)=>{
      const badge = g.id===currentId?'<span style="float:right;font-size:10px;font-weight:800;color:var(--red);letter-spacing:.4px">NOW</span>':(g.id===nextId?'<span style="float:right;font-size:10px;font-weight:800;color:var(--su);letter-spacing:.4px">NEXT</span>':'');
      if(g.type==='final'){
        out+='<div class="final" style="'+(g.id===nextId?'border-color:var(--su);background:var(--su-soft)':'')+'"><div class="ftag"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v4a5 5 0 0 1-10 0z"/></svg>Potential Final · Not Guaranteed'+badge+'</div><div class="ftime num">'+g.time+'</div><div class="ftag" style="color:var(--su)">'+g.opponent+' · Field '+g.field+'</div><div class="fnote">'+g.note+'</div></div>';return;
      }
      out+='<div class="g" style="'+(g.id===currentId?'background:var(--red-bg);border-left:4px solid var(--red)':(g.id===nextId?'background:var(--su-soft);border-left:4px solid var(--su)':''))+'"><div class="ghome">'+(g.home?'Home':'Away')+'</div><div class="grow"><span class="gtime num">'+g.time+'</span><span class="pill field">Field '+g.field+'</span></div><div class="gvs">vs '+g.opponent+'</div>'+badge+'</div>';
      // gap between games
      const next=games[i+1];
      if(next&&next.type!=='final'){
        const h=Math.round((tzTime(next.datetime)-tzTime(g.datetime))/3600000);
        if(h>=3) out+='<div class="gap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 6v6l3 2"/></svg>'+h+'-hour break</div>';
      }
    });
    out+='</div>';
  }
  const SP=TOURNAMENT.schedulePending||{};
  document.getElementById('scheduleDays').innerHTML = out || ('<div class="daycard sun"><div class="dh"><span>Schedule</span><span class="dd">Pending</span></div>'+
    '<div style="padding:14px"><div style="font-weight:800;color:var(--su);font-size:13px;margin-bottom:6px">'+(SP.headline||'Not released yet')+'</div>'+
    '<div style="font-size:12.5px;color:var(--muted);line-height:1.55;margin-bottom:10px">'+(SP.detail||'')+'</div>'+
    '<div style="font-size:12.5px;line-height:1.9;color:var(--ink)">'+
    (SP.accepted?'&#9744; '+SP.accepted+'<br>':'')+
    (SP.brackets?'&#9744; '+SP.brackets+'<br>':'')+
    (SP.schedule?'&#9744; '+SP.schedule:'')+
    '</div></div></div>');
  // our weekend strip
  if(TOURNAMENT.venue.ourFields&&TOURNAMENT.venue.ourFields.length){
    const cells=TOURNAMENT.venue.ourFields.map(f=>'<div><div class="ow num">'+f.f+'</div><div class="owl">'+f.label+'</div></div>').join('<span class="arr">→</span>');
    document.getElementById('ourWeekend').innerHTML='<div class="ourwk">'+cells+'</div><p class="small muted" style="text-align:center;margin:8px 0 0">Memorize the field order</p>';
  }
}

  const groups=TOURNAMENT.nearby.groups.map(g=>'<div class="card"><div class="label" style="margin-bottom:4px">'+g.label+'</div>'+g.items.map(i=>'<a class="tap" href="'+i.url+'" '+(i.url.indexOf('tel:')===0?'':'target="_blank" rel="noopener"')+'><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11h16M4 19h16M4 11v4a5 5 0 0 0 8 3M4 11V8l4-4h9l3 3v4"/></svg></span><div class="tt"><div class="tl">'+i.name+'</div><div class="ts">'+i.note+'</div></div><span class="dist">'+i.dist+'<div class="d">'+i.sub+'</div></span></a>').join('')+'</div>').join('');
  document.getElementById('nearbySection').innerHTML='<div class="section-title"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11h16M4 19h16M4 11v4a5 5 0 0 0 8 3M4 11V8l4-4h9l3 3v4"/></svg>Nearby · During the Break</div>'+groups;
}
function renderContacts(){
  const rows=TOURNAMENT.contacts.map(c=>'<div class="contact"><span class="ci">'+c.initial+'</span><div class="cn"><div class="cnm">'+c.name+'</div><div class="crl">'+c.role+'</div></div>'+(c.phone?'<a href="tel:'+c.phone+'">Call</a>':(c.url?'<a href="'+c.url+'" target="_blank" rel="noopener">Open</a>':''))+'</div>').join('');
  document.getElementById('contactsSection').innerHTML='<div class="section-title"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v4a5 5 0 0 1-10 0z"/></svg>Need Help?</div><div class="card" style="padding:6px 14px">'+rows+'</div>';
}
function renderRules(){
  const quick=TOURNAMENT.rules.quick.map(q=>'<div class="qr"><div class="qrv num">'+q.v+'</div><div class="qrl">'+q.l+'</div></div>').join('');
  const full=TOURNAMENT.rules.full.map(r=>'<div class="ruleline"><b>'+r.k+'</b><span>'+r.v+'</span></div>').join('');
  const tb=TOURNAMENT.rules.tiebreakers.map((t,i)=>'<div class="ruleline"><b>'+(i+1)+'</b><span>'+t+'</span></div>').join('');
  document.getElementById('rulesSection').innerHTML='<div class="section-title"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12l4 6-10 12L2 9z"/><path d="M2 9h20M12 21 8 9l4-6 4 6z"/></svg>Parents Should Know</div><div class="card"><div class="quickrules">'+quick+'</div><details class="acc"><summary>View all tournament rules <span>＋</span></summary><div class="accbody">'+full+'</div></details><details class="acc"><summary>Tiebreakers — in order <span>＋</span></summary><div class="accbody">'+tb+'</div></details><a class="btn ghost" style="margin-top:12px;flex-direction:row;gap:7px" href="'+TOURNAMENT.rules.fullRulesUrl+'" target="_blank" rel="noopener">Official rules document</a></div>';
}
function renderChanges(){
  const rows=TOURNAMENT.changes.map(c=>'<p style="margin:0 0 6px"><b>'+c.k+':</b> '+c.v+'</p>').join('');
  document.getElementById('changesSection').innerHTML='<div class="section-title"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>What Changed · '+TOURNAMENT.tournament.updatesUpdated+'</div><div class="card" style="font-size:13px">'+rows+'</div>';
}

// ---- FULL GUIDE LINK ----
const fg=document.getElementById('fullGuideLink');
fg.href=TOURNAMENT.tournament.fullGuideUrl;
document.getElementById('fg1').textContent='Full '+TOURNAMENT.tournament.name+' Guide';
document.getElementById('fg2').textContent='Everything in one detailed document — hotel, travel scenarios, full rules, itinerary.';

// ---- PACKING (template-driven groups with kind badges) ----
const KIND_LABEL={always:'Always',weather:'Weather',tournament:'Tournament'};
const LS='gd-pack-'+TOURNAMENT.tournament.name.toLowerCase().replace(/[^a-z0-9]+/g,'-');
document.getElementById('packAlert').innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-6-4-6 4z"/></svg><span><b>'+TOURNAMENT.packing.alert+'</b></span>';
function loadPack(){try{return JSON.parse(localStorage.getItem(LS))||{}}catch(e){return{}}}
function savePack(o){localStorage.setItem(LS,JSON.stringify(o));}
function renderPack(){
  const pack=loadPack();const wrap=document.getElementById('packLists');
  const LISTS=(TOURNAMENT.packing&&TOURNAMENT.packing.groups)||[];
  let html='',total=0,done=0;
  LISTS.forEach(grp=>{
    html+='<div class="chkgrp"><h4>'+grp.title+' <span style="font-size:9px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px">'+(KIND_LABEL[grp.kind]||grp.kind)+'</span></h4>';
    grp.items.forEach(([name,sub])=>{
      const id=grp.title+'::'+name;const checked=!!pack[id];if(checked)done++;total++;
      html+='<div class="chk '+(checked?'done':'')+'" onclick="tog(\''+id.replace(/'/g,"\\'")+'\',this)"><span class="box"><svg viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg></span><span class="chkname">'+name+(sub?' <span class="muted small">('+sub+')</span>':'')+'</span></div>';
    });
    html+='</div>';
  });
  wrap.innerHTML=html;
  document.getElementById('packCount').textContent=done+' of '+total;
  document.getElementById('packBar').style.width=(total?Math.round(done/total*100):0)+'%';
}
function tog(id,el){const pack=loadPack();pack[id]=!pack[id];savePack(pack);el.classList.toggle('done',!!pack[id]);renderPack();}
function resetPack(){if(confirm('Reset the packing checklist?')){localStorage.removeItem(LS);renderPack();}}


// ---- HOTELS (from data.json) ----
function renderHotels(){
  var el=document.getElementById('hotelsSection'); if(!el) return;
  if(!TOURNAMENT.hotels || !TOURNAMENT.hotels.length){ el.innerHTML=''; return; }
  var picks=TOURNAMENT.hotels.filter(function(h){return h.tier==='pick';});
  var alts =TOURNAMENT.hotels.filter(function(h){return h.tier==='alt';});
  function card(h){
    return '<div style="padding:12px 14px;border-bottom:1px solid var(--line)">'
      + '<div style="font-weight:700;font-size:14px">'+h.name+'</div>'
      + '<div class="muted small">'+(h.chain||'')+(h.rate?' · '+h.rate:'')+'</div>'
      + '<div style="color:var(--su);font-weight:700;font-size:12.5px;margin-top:3px">Drive to venue: '+(h.drive||'—')+'</div>'
      + (h.best?'<div style="color:var(--green);font-weight:700;font-size:12px;margin-top:3px">Best value</div>':'')
      + (h.note?'<div class="muted small" style="margin-top:3px">'+h.note+'</div>':'')
      + '</div>';
  }
  var html='<div class="card" style="padding:0;overflow:hidden">';
  html+='<div style="padding:12px 14px;background:var(--amber-bg);color:var(--amber);font-size:12px;font-weight:700">Irmo is 80% sold out for these dates. Rates change daily — confirm before booking.</div>';
  html+=picks.map(card).join('');
  if(alts.length){ html+='<div style="padding:10px 14px;background:var(--bg);font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)">Also available</div>'+alts.map(card).join(''); }
  html+='</div>';
  el.innerHTML=html;
}

// ---- INIT + LIVE TICK ----
function renderAll(){
renderVenue();renderBreak();renderNearby();renderContacts();renderRules();renderChanges();renderWeather();renderPack();renderHotels();
}
renderAll();
// Load live data — overrides the fallback above so the cron job keeps this current.
(async function(){
  try{
    var r=await fetch('data.json?_='+Date.now());
    var d=await r.json();
    adaptData(d);
    renderHero(); renderAll();
    lastStateKey=''; refreshAll();
  }catch(e){ /* keep fallback */ }
})();
lastStateKey=''; // force initial full render (schedule, countdown, next-match, context, weekend status)
refreshAll();
// Load the live forecast once on load; then refresh whenever the tab regains focus so
// new daily reports appear without a manual reload.
loadWeather();
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) loadWeather(); });
// Countdown ticks every second; full state (Next Match / context / schedule highlight /
// weekend status) re-resolves every second too, but only re-renders when the resolved
// state actually changes (cheap + consistent).
setInterval(refreshAll,1000);
</script>
