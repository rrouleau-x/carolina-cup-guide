<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0055A4">
<title>Carolina Cup — Savannah United 17/18B</title>
<style>
  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{margin:0;background:#f2f2f7;color:#3a3a3c;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif;
    display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px;}
  .card{background:#fff;border-radius:16px;max-width:420px;width:100%;
    padding:32px 24px;text-align:center;box-shadow:0 2px 20px rgba(0,0,0,.06);}
  .badge{display:inline-block;background:#e8f0fb;color:#0055A4;font-size:11px;
    font-weight:700;letter-spacing:.08em;text-transform:uppercase;
    padding:5px 12px;border-radius:999px;margin-bottom:16px;}
  h1{font-size:22px;margin:0 0 6px;color:#1d1d1f;letter-spacing:-.4px;line-height:1.25;}
  .sub{font-size:14px;color:#86868b;margin:0 0 4px;}
  .team{font-size:13px;color:#86868b;margin:0 0 24px;}
  a.btn{display:block;background:#0055A4;color:#fff;text-decoration:none;
    padding:15px;border-radius:11px;font-weight:600;font-size:15px;margin-bottom:10px;}
  a.ghost{display:block;background:#f2f2f7;color:#0055A4;text-decoration:none;
    padding:15px;border-radius:11px;font-weight:600;font-size:15px;margin-bottom:22px;}
  .note{font-size:11px;color:#aeaeb2;line-height:1.6;margin:0;}
</style>
</head>
<body>
  <div class="card">
    <span class="badge">Oct 2&ndash;4, 2026</span>
    <h1>26th Annual Carolina Cup</h1>
    <p class="sub">Ballentine Park &middot; Irmo, South Carolina</p>
    <p class="team">Savannah United 17/18B Travel</p>

    <a class="btn" href="app/">Open the Companion App</a>
    <a class="ghost" href="https://rrouleau-x.github.io/tournament-guide-studio/sample/">Read the Full Written Guide</a>

    <p class="note">
      The app works offline &mdash; add it to your home screen for game day.
      Schedule, field assignments, and opponents post September 24.
    </p>
  </div>
</body>
</html>
