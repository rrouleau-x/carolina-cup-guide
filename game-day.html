<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0055A4">
<title>Carolina Cup Guide</title>
<!-- Game Day and the companion app are now ONE app. This URL is kept as an
     alias so existing bookmarks and shared links still work. -->
<link rel="canonical" href="app/">
<meta http-equiv="refresh" content="0; url=./app/">
<script>
  (function () {
    var q = location.search ? location.search.replace(/^\?/, '') : '';
    var h = location.hash || '';
    var dest = './app/' + (q ? '?' + q : '') + h;
    location.replace(dest);
  })();
</script>
<style>
  body{margin:0;background:#eef1f6;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",Arial,sans-serif;
       display:flex;align-items:center;justify-content:center;min-height:100vh;color:#1d1d1f;text-align:center;padding:24px}
  a{color:#0055A4;font-weight:700}
</style>
</head>
<body>
  <div>
    <p style="font-size:15px;font-weight:600">Opening the Carolina Cup Guide&hellip;</p>
    <p style="font-size:13px;color:#6e6e73">If nothing happens, <a href="./app/">tap here</a>.</p>
  </div>
</body>
</html>
